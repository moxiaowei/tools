<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>🧰 我的工具箱</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f1420; --panel:#1a2133; --panel2:#222c42; --line:#2c3852;
    --txt:#e8edf7; --sub:#8b9ab5; --accent:#4f8cff; --teal:#2dd4a7; --gold:#f5b942;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #1c2b4a 0%, var(--bg) 55%);
    color:var(--txt); min-height:100vh; padding:0 0 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 18px}
  header{padding:46px 0 26px;text-align:center}
  .logo{font-size:44px;line-height:1;filter:drop-shadow(0 4px 16px rgba(79,140,255,.5))}
  h1{font-size:26px;font-weight:800;letter-spacing:.5px;margin:14px 0 6px;
     background:linear-gradient(100deg,#8fb4ff,#2dd4a7 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--sub);font-size:13.5px;letter-spacing:1px}
  .status{margin-top:16px;font-size:12.5px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(45,212,167,.13)}
  .dot.off{background:#6b7688;box-shadow:0 0 0 4px rgba(107,118,136,.13)}
  .sec{margin:26px 0 4px}
  .sec-h{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700;color:#cfe0ff;margin-bottom:12px}
  .sec-h .bar{width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--teal))}
  .sec-h .cnt{font-size:11.5px;color:var(--sub);font-weight:500;background:var(--panel);padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;
    padding:15px 15px 13px;text-decoration:none;color:inherit;display:block;transition:.18s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-2px);border-color:#3d5480;box-shadow:0 10px 26px rgba(0,0,0,.32)}
  .card:active{transform:scale(.985)}
  .ico{font-size:22px;display:block;margin-bottom:9px}
  .name{font-size:14.5px;font-weight:700;margin-bottom:4px}
  .desc{font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:11px;min-height:18px}
  .tag{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--sub)}
  .tag.live{color:#7fb2ff;border-color:rgba(79,140,255,.4);background:rgba(79,140,255,.1)}
  .tag.read{color:#8bd8c0;border-color:rgba(45,212,167,.35);background:rgba(45,212,167,.08)}
  .tag.perm{color:#f5c86a;border-color:rgba(245,185,66,.35);background:rgba(245,185,66,.08)}
  .tag.local{color:#9aa8c2}
  .hint{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;font-size:12.5px;color:var(--sub);line-height:1.75}
  .hint b{color:#bcd0f0}
  footer{margin-top:26px;text-align:center;font-size:12px;color:#5d6a80;line-height:1.8}

  /* ── 登录层 ── */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;
    background:radial-gradient(900px 500px at 50% 0%, #1b2740 0%, #0c1119 60%);z-index:50}
  .box{width:100%;max-width:360px;background:linear-gradient(165deg,#19202f,#141a26);
    border:1px solid var(--line);border-radius:18px;padding:30px 26px 24px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .box .ico2{font-size:38px;line-height:1;margin-bottom:12px;filter:drop-shadow(0 6px 18px rgba(79,140,255,.45))}
  .box h2{font-size:18px;font-weight:700;margin-bottom:6px}
  .box p{font-size:12.5px;color:var(--sub);margin-bottom:22px}
  .fld{text-align:left;margin-bottom:13px}
  .fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
  .fld input{width:100%;font:inherit;font-size:15px;padding:12px 13px;border-radius:11px;
    background:#0e131d;border:1px solid #27303f;color:var(--txt);outline:none;transition:.15s}
  .fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.16)}
  .remember{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);margin:4px 0 18px}
  .remember input{width:15px;height:15px;accent-color:var(--accent)}
  #loginBtn{width:100%;font:inherit;font-size:15px;font-weight:700;padding:13px;border-radius:11px;border:none;
    background:linear-gradient(100deg,var(--accent),#2fb3a0);color:#fff;cursor:pointer;transition:.15s}
  #loginBtn:hover{filter:brightness(1.08)}
  #loginBtn:active{transform:scale(.985)}
  #loginBtn:disabled{opacity:.6;cursor:not-allowed}
  #err{min-height:18px;font-size:12.5px;color:#ff8080;margin-top:12px}
  .lockmsg{margin-top:14px;font-size:11.5px;color:#5d6a80;line-height:1.7}
  #main{display:none}
  .logout{position:fixed;right:14px;top:14px;font-size:12px;color:var(--sub);background:rgba(20,26,38,.9);
    border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;z-index:20}
  .logout:hover{color:#fff;border-color:#3d5480}
  @media(max-width:520px){ header{padding:34px 0 20px} .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))} }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="ico2">🔐</div>
    <h2>私人工具箱</h2>
    <p>请输入账号密码后进入</p>
    <div class="fld"><label>账号</label>
      <input id="u" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="账号"></div>
    <div class="fld"><label>密码</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="密码"></div>
    <label class="remember"><input id="rm" type="checkbox" checked> 记住本设备（30 天免登录）</label>
    <button id="loginBtn">进入工具箱</button>
    <div id="err"></div>
    <div class="lockmsg">· 内容已加密，密码错误无法读取<br>· 仅限本人使用</div>
  </div>
</div>

<div id="main" class="wrap">
  <button class="logout" id="logoutBtn">退出</button>
  <header>
    <div class="logo">🧰</div>
    <h1>我的工具箱</h1>
    <div class="sub">财务 · 投资 · 历史 · 备考 · 生活</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">检测服务器…</span></div>
  </header>

  <div id="app"></div>

  <div class="hint">
    💡 本页为<b>永久导航入口</b>。标 <b>⚡实时</b> 的工具依赖家里服务器，服务器在线即可用（隧道换址会自动同步，无需重新收藏）。
    标 <b>🌐永久</b> 的是已托管到 GitHub Pages 的公开版，服务器关机也能打开。
  </div>

  <footer>
    <div id="footDate"></div>
    <div>数据与记录保存在你自己的浏览器(本地)，不经第三方服务器</div>
  </footer>
</div>

<script>
/* ============ 加密数据（AES-256-GCM，密钥由密码 PBKDF2 派生） ============ */

const USER = "moxiaowei";
const SKEY = "mm_tools_key";
const STS  = "mm_tools_ts";
const DAYS = 30;

const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function deriveKey(pwd){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt: b64d(ENC.salt), iterations: ENC.iters, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}

async function decryptWith(key){
  const ct = b64d(ENC.ct);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: b64d(ENC.iv)}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function tryAutoLogin(){
  const k = localStorage.getItem(SKEY), ts = +localStorage.getItem(STS) || 0;
  if(!k) return null;
  if(Date.now() - ts > DAYS*864e5){ localStorage.removeItem(SKEY); localStorage.removeItem(STS); return null; }
  try{
    const key = await crypto.subtle.importKey("raw", b64d(k), {name:"AES-GCM"}, true, ["decrypt"]);
    return await decryptWith(key);
  }catch(e){ localStorage.removeItem(SKEY); return null; }
}

/* ============ 渲染 ============ */
let DATA = null;

function cardHTML(it, base){
  const href = it.href || (base + it.path);
  const cls = it.tag==='live'?'live':it.tag==='perm'?'perm':it.tag==='read'?'read':'local';
  const tn = it.tagName || (it.tag==='live'?'⚡实时':it.tag==='read'?'阅读':'本地');
  return `<a class="card" href="${href}" target="_blank" rel="noopener">
    <span class="ico">${it.ico}</span>
    <div class="name">${it.name}</div>
    <div class="desc">${it.desc}</div>
    <span class="tag ${cls}">${tn}</span>
  </a>`;
}

function paint(base){
  let html='';
  DATA.groups.forEach(g=>{
    html += `<div class="sec"><div class="sec-h"><span class="bar"></span>${g.t}<span class="cnt">${g.items.length}</span></div>`;
    html += `<div class="grid">`+g.items.map(it=>cardHTML(it,base)).join('')+`</div></div>`;
  });
  html += `<div class="sec"><div class="sec-h"><span class="bar"></span>🌐 永久公开版（服务器关机也能看）<span class="cnt">${DATA.perms.length}</span></div>`;
  html += `<div class="grid">`+DATA.perms.map(it=>cardHTML(it,'')).join('')+`</div></div>`;
  $('app').innerHTML = html;
}

function startApp(){
  $('login').style.display='none';
  $('main').style.display='block';

  const d = new Date();
  $('footDate').textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 更新';

  const host = location.hostname;
  const isTunnel = host.includes('trycloudflare') || host==='localhost' || host.startsWith('127.');
  const dot=$('dot'), st=$('statusTxt');

  if(isTunnel){
    paint('');
    dot.className='dot'; st.textContent='运行于家庭服务器 · 全部工具可用';
  }else{
    fetch('live.json?t='+Date.now(), {cache:'no-store'})
      .then(r=>r.json())
      .then(cfg=>{
        const base = (cfg && cfg.base) ? cfg.base.replace(/\/$/,'') : '';
        paint(base); checkAlive(base);
      })
      .catch(()=>{ paint(''); checkAlive(''); });
  }
}

function checkAlive(base){
  const ac = new AbortController();
  const to = setTimeout(()=>ac.abort(), 6000);
  fetch(base+'/live.json?t='+Date.now(), {signal:ac.signal, cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(j=>{ clearTimeout(to);
      $('dot').className='dot'; $('statusTxt').textContent = j&&j.base? '服务器在线 · 工具可用' : '服务器在线'; })
    .catch(()=>{ clearTimeout(to);
      $('dot').className='dot off'; $('statusTxt').textContent='服务器离线 · 仅🌐永久版可用'; });
}

/* ============ 登录交互 ============ */
let fails = 0, lockedUntil = 0;

async function doLogin(){
  const u = $('u').value.trim();
  const p = $('p').value;
  const err = $('err'), btn = $('loginBtn');

  if(Date.now() < lockedUntil){
    err.textContent = `尝试次数过多，请 ${Math.ceil((lockedUntil-Date.now())/1000)} 秒后再试`;
    return;
  }
  if(!u || !p){ err.textContent='请填写账号和密码'; return; }

  btn.disabled = true; btn.textContent = '验证中…'; err.textContent='';
  try{
    if(u !== USER) throw new Error('bad');
    const key = await deriveKey(p);
    DATA = await decryptWith(key);

    if($('rm').checked){
      const raw = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(SKEY, b64e(raw));
      localStorage.setItem(STS, Date.now());
    }else{
      localStorage.removeItem(SKEY); localStorage.removeItem(STS);
    }
    startApp();
  }catch(e){
    fails++;
    if(fails >= 5){ lockedUntil = Date.now()+60000; fails = 0; err.textContent='错误次数过多，已锁定 60 秒'; }
    else err.textContent = `账号或密码错误（还可尝试 ${5-fails} 次）`;
    $('p').value = '';
    $('p').focus();
  }finally{
    btn.disabled = false; btn.textContent = '进入工具箱';
  }
}

$('loginBtn').addEventListener('click', doLogin);
$('p').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
$('u').addEventListener('keydown', e=>{ if(e.key==='Enter') $('p').focus(); });
$('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem(SKEY); localStorage.removeItem(STS);
  location.reload();
});

/* ============ 启动 ============ */
(async function(){
  if(!window.crypto || !crypto.subtle){
    $('err').textContent = '当前环境不支持加密（请用 https 或 localhost 访问）';
    return;
  }
  const auto = await tryAutoLogin();
  if(auto){ DATA = auto; startApp(); }
  else { setTimeout(()=>$('u').focus(), 200); }
})();
</script>
</body>
</html>
